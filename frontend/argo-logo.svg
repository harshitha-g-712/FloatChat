<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Clip path to keep all internal wave layers inside the circular emblem -->
    <clipPath id="circleClip">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>

    <!-- Ocean Deep Gradient -->
    <linearGradient id="oceanCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>

    <!-- ARGO Float Hull (Classic Oceanographic Yellow) -->
    <linearGradient id="floatHull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sensor Collar -->
    <linearGradient id="sensorCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Circular Portal / Lens Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#oceanCircle)"/>

  <!-- Telemetry and Float Inside Circle -->
  <g clip-path="url(#circleClip)">
    <!-- Sonar Depth Rings -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="2 3"/>
    <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

    <!-- Satellite Telemetry Transmission Rings -->
    <path d="M26 12 C 29 9, 35 9, 38 12" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M22 8 C 28 3, 36 3, 42 8" fill="none" stroke="#00c2ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- ARGO Float Antenna -->
    <line x1="32" y1="12" x2="32" y2="20" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="32" cy="11" r="2" fill="#38bdf8"/>

    <!-- ARGO Float CTD Sensor Collar -->
    <rect x="29" y="20" width="6" height="4" rx="1" fill="url(#sensorCap)"/>

    <!-- ARGO Float Hydrodynamic Cylinder Hull -->
    <path d="M28.5 24 L35.5 24 L35 44 C 35 46.5, 29 46.5, 29 44 Z" fill="url(#floatHull)"/>
    <!-- Hull Reflective Highlight -->
    <line x1="30.5" y1="25" x2="30.5" y2="43" stroke="#fef08a" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Ocean Wave Layer 1 (Mid Depth) -->
    <path d="M0 37 C 12 32, 20 42, 32 37 C 44 32, 52 41, 64 36 L 64 64 L 0 64 Z" 
          fill="url(#wave1)" fill-opacity="0.4"/>

    <!-- Ocean Wave Layer 2 (Deep Surface) -->
    <path d="M0 42 C 12 37, 20 46, 32 41 C 44 36, 52 45, 64 40 L 64 64 L 0 64 Z" 
          fill="#0284c7" fill-opacity="0.9"/>

    <!-- Ocean Wave Layer 3 (Foreground Deep) -->
    <path d="M0 48 C 14 43, 24 51, 34 46 C 44 41, 54 49, 64 45 L 64 64 L 0 64 Z" 
          fill="#0a2540"/>

    <!-- Surface Wave Foam Line -->
    <path d="M0 42 C 12 37, 20 46, 32 41 C 44 36, 52 45, 64 40" 
          fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9"/>
  </g>

  <!-- Outer Lens Ring Border -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
</svg>
